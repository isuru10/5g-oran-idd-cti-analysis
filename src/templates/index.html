<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5G O-RAN CTI Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="background-mesh"></div>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="gradient-text">5G O-RAN</span>
                <span class="subtitle">Threat Detection & CTI Enrichment</span>
            </div>
        </header>

        <main class="dashboard">
            <section class="glass-panel control-panel">
                <h2>1. Select Network Event</h2>
                <div class="custom-select">
                    <select id="eventSelect">
                        <option value="" disabled selected>Loading test events...</option>
                    </select>
                </div>
                <button id="analyzeBtn" class="primary-btn" disabled>
                    <span class="btn-text">Analyze Threat</span>
                    <span class="loader hidden"></span>
                </button>
            </section>

            <section class="glass-panel alert-panel hidden" id="alertPanel">
                <h2>2. ML Prediction & SHAP Evidence</h2>
                <div class="alert-content">
                    <div class="alert-header">
                        <div class="threat-badge" id="threatBadge">--</div>
                        <div class="confidence" id="confidenceBar">
                            <span>Confidence: <span id="confValue">0%</span></span>
                            <div class="progress-bar"><div class="fill" id="confFill"></div></div>
                        </div>
                    </div>
                    
                    <div class="component-box">
                        <strong>Target Component:</strong> <span id="targetComponent">--</span>
                    </div>

                    <div class="shap-evidence">
                        <h3>SHAP Feature Contributions</h3>
                        <p id="evidenceSummary" class="text-sm"></p>
                        <div class="shap-bars" id="shapBars">
                            <!-- Injected via JS -->
                        </div>
                    </div>

                    <button id="generateBtn" class="secondary-btn">
                        <span class="btn-text">Generate CTI Report via LLM</span>
                        <span class="loader hidden"></span>
                    </button>
                </div>
            </section>

            <section class="glass-panel report-panel hidden" id="reportPanel">
                <h2>3. Explanation-Led Incident Report</h2>
                <div id="reportContent" class="markdown-body">
                    <!-- Injected via JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
